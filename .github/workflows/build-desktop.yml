name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-desktop.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'launcher-main.js'
      - 'preload-launcher.js'
      - 'src/**'
      - 'main/**'
      - 'assets/clips/**'
      - 'main.js'
      - 'preload.js'
    tags:
      - 'v*'

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  CSC_IDENTITY_AUTO_DISCOVERY: false
  ELECTRON_BUILDER_DISABLE_WINDOWS_CODE_SIGNING: true

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Mac installer
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            dist/*.exe
          retention-days: 30
